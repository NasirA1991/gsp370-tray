name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Unit tests
        run: cargo test --release --locked --manifest-path rust/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path rust/Cargo.toml
      - name: PTY end-to-end test
        run: python3 tests/e2e_pty.py ./rust/target/release/gsp370-tray
