[package]
name = "gsp370-tray"
version = "2.0.5"
edition = "2021"
license = "MIT"
description = "Minimal StatusNotifierItem tray for the Sennheiser/EPOS GSP 370"

[dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
ab_glyph = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
