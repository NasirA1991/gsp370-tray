[package]
name = "gsp370-tray"
version = "2.2.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Minimal StatusNotifierItem tray for the Sennheiser/EPOS GSP 370"

[dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
ab_glyph = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
